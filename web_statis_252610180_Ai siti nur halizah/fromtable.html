
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form dan Table Data Siswa</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px;
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #26344a;
            font-size: 13px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .card {
            background: white;
            border: 1px solid #dce5f5;
            border-radius: 9px;
            margin-bottom: 20px;
            overflow: hidden;
            box-shadow: 0 2px 6px #dce3ef;
        }

        .card-header {
            background: #edf0ff;
            padding: 13px 16px;
            font-weight: bold;
            color: #34436b;
            border-bottom: 1px solid #e1e7f5;
        }

        .card-body {
            padding: 16px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            margin-bottom: 13px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #d9e0ec;
            border-radius: 5px;
            outline: none;
            font-size: 12px;
            background: white;
        }

        input:focus, select:focus {
            border-color: #6178f5;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            align-items: center;
            min-height: 35px;
        }

        .radio-group label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: normal;
            margin: 0;
        }

        .radio-group input {
            width: auto;
        }

        button {
            border: none;
            border-radius: 5px;
            padding: 9px 14px;
            cursor: pointer;
            color: white;
            font-size: 12px;
        }

        .btn-primary {
            background: #596cf5;
        }

        .btn-secondary {
            background: white;
            border: 1px solid #d4dce9;
            color: #475569;
        }

        .btn-edit {
            background: #4e7bf5;
            padding: 6px 9px;
            margin-right: 5px;
        }

        .btn-delete {
            background: #ed4c55;
            padding: 6px 9px;
        }

        .table-tools {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 14px;
        }

        .table-tools input {
            max-width: 260px;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }

        th, td {
            padding: 12px 10px;
            text-align: left;
            border-bottom: 1px solid #e8edf5;
            font-size: 12px;
        }

        th {
            background: #edf0ff;
            color: #34436b;
        }

        tbody tr:nth-child(even) {
            background: #f4f7fc;
        }

        tbody tr:hover {
            background: #edf2ff;
        }

        .table-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-top: 16px;
            color: #53627a;
            font-size: 12px;
        }

        .pagination {
            display: flex;
            gap: 5px;
        }

        .pagination button {
            background: white;
            border: 1px solid #dce3ee;
            color: #53627a;
            padding: 7px 11px;
        }

        .pagination button.active {
            background: #596cf5;
            color: white;
        }

        .empty {
            text-align: center;
            padding: 20px;
            color: #7b8799;
        }

        @media (max-width: 650px) {
            body {
                padding: 12px;
            }

            .form-grid {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .table-footer {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- FORM TAMBAH SISWA -->
    <div class="card">
        <div class="card-header">
            ✚ &nbsp; Tambah Data Siswa
        </div>

        <div class="card-body">
            <form id="formSiswa">
                <div class="form-grid">

                    <div>
                        <div class="form-group">
                            <label for="nis">NIS</label>
                            <input type="text" id="nis"
                                placeholder="Masukkan NIS" required>
                        </div>

                        <div class="form-group">
                            <label for="nama">Nama Lengkap</label>
                            <input type="text" id="nama"
                                placeholder="Masukkan nama lengkap" required>
                        </div>

                        <div class="form-group">
                            <label for="kelas">Kelas</label>
                            <select id="kelas" required>
                                <option value="">Pilih kelas</option>
                                <option>X RPL 1</option>
                                <option>X RPL 2</option>
                                <option>X RPL 3</option>
                                <option>XI RPL 1</option>
                                <option>XI RPL 2</option>
                                <option>XII RPL 1</option>
                                <option>XII RPL 2</option>
                                <option>XII RPL 3</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <div class="form-group">
                            <label>Jenis Kelamin</label>
                            <div class="radio-group">
                                <label>
                                    <input type="radio" name="jk"
                                        value="Laki-laki" required>
                                    Laki-laki
                                </label>

                                <label>
                                    <input type="radio" name="jk"
                                        value="Perempuan">
                                    Perempuan
                                </label>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="tanggal">Tanggal Lahir</label>
                            <input type="date" id="tanggal" required>
                        </div>
                    </div>

                </div>

                <button type="submit" class="btn-primary" id="btnSimpan">
                    ＋ Simpan
                </button>

                <button type="reset" class="btn-secondary">
                    ↻ Reset
                </button>
            </form>
        </div>
    </div>

    <!-- TABEL DATA SISWA -->
    <div class="card">
        <div class="card-header">
            ☷ &nbsp; Data Siswa
        </div>

        <div class="card-body">

            <div class="table-tools">
                <input type="search" id="cari"
                    placeholder="⌕ Cari nama atau NIS...">
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>NIS</th>
                            <th>Nama Lengkap</th>
                            <th>Kelas</th>
                            <th>Jenis Kelamin</th>
                            <th>Tanggal Lahir</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>

                    <tbody id="tabelSiswa"></tbody>
                </table>
            </div>

            <div class="table-footer">
                <span id="jumlahData">Menampilkan data siswa</span>
                <div class="pagination" id="pagination"></div>
            </div>

        </div>
    </div>

</div>

<script>
    // Data awal untuk ditampilkan dalam tabel
    let siswa = [
        {
            nis: "001",
            nama: "Andi Setiawan",
            kelas: "X RPL 1",
            jk: "Laki-laki",
            tanggal: "2008-01-15"
        },
        {
            nis: "002",
            nama: "Budi Santoso",
            kelas: "X RPL 1",
            jk: "Laki-laki",
            tanggal: "2008-03-22"
        },
        {
            nis: "003",
            nama: "Citra Lestari",
            kelas: "X RPL 2",
            jk: "Perempuan",
            tanggal: "2008-07-10"
        },
        {
            nis: "004",
            nama: "Deni Pratama",
            kelas: "X RPL 2",
            jk: "Laki-laki",
            tanggal: "2008-09-05"
        },
        {
            nis: "005",
            nama: "Eka Wijaya",
            kelas: "X RPL 3",
            jk: "Perempuan",
            tanggal: "2008-11-18"
        }
    ];

    let indeksEdit = -1;
    let halaman = 1;
    const perHalaman = 5;

    const form = document.getElementById("formSiswa");
    const tabel = document.getElementById("tabelSiswa");
    const cari = document.getElementById("cari");

    // Menampilkan data siswa ke dalam tabel
    function tampilkanData() {
        const kata = cari.value.toLowerCase();

        const hasil = siswa.filter(s =>
            s.nis.toLowerCase().includes(kata) ||
            s.nama.toLowerCase().includes(kata)
        );

        const totalHalaman = Math.max(
            1, Math.ceil(hasil.length / perHalaman)
        );

        halaman = Math.min(halaman, totalHalaman);

        const awal = (halaman - 1) * perHalaman;
        const dataHalaman = hasil.slice(awal, awal + perHalaman);

        tabel.innerHTML = "";

        if (dataHalaman.length === 0) {
            tabel.innerHTML = `
                <tr>
                    <td colspan="7" class="empty">
                        Data siswa tidak ditemukan
                    </td>
                </tr>`;
        }

        dataHalaman.forEach((s, i) => {
            const baris = document.createElement("tr");

            const isi = [
                awal + i + 1,
                s.nis,
                s.nama,
                s.kelas,
                s.jk,
                s.tanggal,
            ];

            isi.forEach(nilai => {
                const td = document.createElement("td");
                td.textContent = nilai;
                baris.appendChild(td);
            });

            const aksi = document.createElement("td");

            const edit = document.createElement("button");
            edit.type = "button";
            edit.className = "btn-edit";
            edit.textContent = "✎";
            edit.title = "Edit data";
            edit.onclick = () => editData(
                siswa.indexOf(s)
            );

            const hapus = document.createElement("button");
            hapus.type = "button";
            hapus.className = "btn-delete";
            hapus.textContent = "▣";
            hapus.title = "Hapus data";
            hapus.onclick = () => hapusData(
                siswa.indexOf(s)
            );

            aksi.append(edit, hapus);
            baris.appendChild(aksi);
            tabel.appendChild(baris);
        });

        document.getElementById("jumlahData").textContent =
            hasil.length === 0
                ? "Tidak ada data"
                : `Menampilkan ${awal + 1} - ${
                    Math.min(awal + perHalaman, hasil.length)
                } dari ${hasil.length} data`;

        const nav = document.getElementById("pagination");
        nav.innerHTML = "";

        const sebelumnya = document.createElement("button");
        sebelumnya.textContent = "‹";
        sebelumnya.disabled = halaman === 1;
        sebelumnya.onclick = () => {
            halaman--;
            tampilkanData();
        };
        nav.appendChild(sebelumnya);

        for (let i = 1; i <= totalHalaman; i++) {
            const tombol = document.createElement("button");
            tombol.textContent = i;

            if (i === halaman) tombol.className = "active";

            tombol.onclick = () => {
                halaman = i;
                tampilkanData();
            };

            nav.appendChild(tombol);
        }

        const berikutnya = document.createElement("button");
        berikutnya.textContent = "›";
        berikutnya.disabled = halaman === totalHalaman;
        berikutnya.onclick = () => {
            halaman++;
            tampilkanData();
        };
        nav.appendChild(berikutnya);
    }

    // Menyimpan data baru atau memperbarui data yang diedit
    form.addEventListener("submit", function(event) {
        event.preventDefault();

        const nis = document.getElementById("nis").value.trim();
        const nama = document.getElementById("nama").value.trim();
        const kelas = document.getElementById("kelas").value;
        const jk = document.querySelector(
            'input[name="jk"]:checked'
        )?.value;
        const tanggal = document.getElementById("tanggal").value;

        if (!nis || !nama || !kelas || !jk || !tanggal) {
            alert("Semua data harus diisi!");
            return;
        }

        const duplikat = siswa.some((s, i) =>
            s.nis.toLowerCase() === nis.toLowerCase() &&
            i !== indeksEdit
        );

        if (duplikat) {
            alert("NIS sudah digunakan!");
            return;
        }

        const dataBaru = { nis, nama, kelas, jk, tanggal };

        if (indeksEdit === -1) {
            siswa.push(dataBaru);
            alert("Data siswa berhasil disimpan!");
        } else {
            siswa[indeksEdit] = dataBaru;
            alert("Data siswa berhasil diperbarui!");
        }

        indeksEdit = -1;
        document.getElementById("btnSimpan").textContent = "＋ Simpan";
        form.reset();
        halaman = Math.ceil(
            siswa.filter(s =>
                s.nis.toLowerCase().includes(cari.value.toLowerCase()) ||
                s.nama.toLowerCase().includes(cari.value.toLowerCase())
            ).length / perHalaman
        ) || 1;

        tampilkanData();
    });

    // Mengisi form dengan data yang akan diedit
    function editData(index) {
        const s = siswa[index];

        document.getElementById("nis").value = s.nis;
        document.getElementById("nama").value = s.nama;
        document.getElementById("kelas").value = s.kelas;
        document.getElementById("tanggal").value = s.tanggal;

        document.querySelector(
            `input[name="jk"][value="${s.jk}"]`
        ).checked = true;

        indeksEdit = index;
        document.getElementById("btnSimpan").textContent = "✓ Perbarui";
        document.getElementById("nis").focus();

        window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // Menghapus data siswa
    function hapusData(index) {
        const yakin = confirm(
            "Apakah kamu yakin ingin menghapus data siswa ini?"
        );

        if (yakin) {
            siswa.splice(index, 1);
            tampilkanData();
        }
    }

    // Mengosongkan form dan membatalkan mode edit
    form.addEventListener("reset", function() {
        indeksEdit = -1;
        document.getElementById("btnSimpan").textContent = "＋ Simpan";
    });

    // Mencari data berdasarkan NIS atau nama
    cari.addEventListener("input", function() {
        halaman = 1;
        tampilkanData();
    });

    // Menampilkan data pertama kali
    tampilkanData();
</script>

</body>
</html>
